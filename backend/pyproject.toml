[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "failurelab-api"
version = "1.0.0"
description = "Cloud resilience experiment platform API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.5,<3.0", "boto3>=1.35,<2.0", "scikit-learn>=1.5,<2.0", "numpy>=1.26,<3.0", "reportlab>=4.2,<5.0", "httpx>=0.27,<1.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.24,<2.0", "ruff>=0.6,<1.0"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["F"]
ignore = ["E501"]
