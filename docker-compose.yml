name: failurelab
services:
  testbed:
    build:
      context: ./testbed
    container_name: failurelab-target-testbed
    environment:
      TESTBED_CONTROL_TOKEN: local-testbed-control-token
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: failurelab-api
    environment:
      APP_ENV: development
      AWS_MODE: "false"
      DATABASE_PATH: /app/data/failurelab.db
      REPORTS_DIR: /app/reports
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SIMULATION_TIME_SCALE: "1.0"
      TESTBED_URL: http://testbed:9000
      TESTBED_CONTROL_TOKEN: local-testbed-control-token
    ports:
      - "8000:8000"
    volumes:
      - failurelab-data:/app/data
      - failurelab-reports:/app/reports
    depends_on:
      testbed:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_AUTH_MODE: demo
        VITE_ENABLE_REAL_FIS: "false"
    container_name: failurelab-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  failurelab-data:
  failurelab-reports:
